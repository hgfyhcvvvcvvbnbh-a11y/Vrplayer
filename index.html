<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Personal VR / 360 video player with gyroscope look control">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VR Player">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23000' width='192' height='192'/><circle cx='96' cy='96' r='60' fill='none' stroke='%23fff' stroke-width='8'/><polygon points='80,75 80,117 120,96' fill='%23fff'/></svg>">
<title>VR Player</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Picker screen ---------- */
  #picker-screen {
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #picker-box { text-align: center; color: #fff; padding: 40px 32px; }
  #picker-icon {
    width: 64px; height: 64px; margin: 0 auto 24px;
    border-radius: 50%; background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcaf45);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff;
  }
  #picker-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.4px; }
  #picker-sub { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 32px; line-height: 1.4; }
  .picker-btn {
    display: block; width: 280px; margin: 0 auto 10px;
    padding: 11px 0; border-radius: 8px;
    background: linear-gradient(135deg, #833ab4, #fd1d1d);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; border: none; transition: opacity 0.2s;
  }
  .picker-btn:active { opacity: 0.8; }
  .picker-btn.secondary { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.3); }

  /* ---------- Viewer ---------- */
  #viewer {
    position: fixed; inset: 0; display: none;
    background: #000; touch-action: none;
  }
  #vr-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gesture-layer {
    position: absolute; inset: 0; z-index: 3;
    background: transparent; touch-action: none;
  }

  .top-nav {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 12px 14px; display: flex;
    justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    z-index: 5; color: #fff;
    transition: opacity 0.35s ease;
  }
  .nav-title {
    font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
    flex: 1 1 auto; min-width: 0; margin-right: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-icons { display: flex; gap: 10px; align-items: center; flex: 0 0 auto; }
  .nav-icon {
    font-size: 17px; cursor: pointer; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12); border-radius: 50%;
  }
  .nav-icon.active { background: linear-gradient(135deg, #833ab4, #fd1d1d); }
  .nav-icon.off { opacity: 0.4; }

  .counter {
    position: absolute; top: 54px; left: 14px; z-index: 5;
    font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 600;
    transition: opacity 0.35s ease;
  }

  .video-name-badge {
    position: absolute; top: 12px; left: 14px; right: 14px; z-index: 7;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none; max-width: 70%;
  }
  .video-name-badge.error { color: #ff6b6b; }

  .error-detail {
    position: absolute; top: 30px; left: 14px; right: 14px; z-index: 7;
    font-size: 11px; font-weight: 500; color: #ff9b9b;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    white-space: normal; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  .error-detail.show { opacity: 1; }

  .jump-badge {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 13px; color: #fff; font-weight: 700;
    background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 12px;
    opacity: 0; transition: opacity 0.15s;
  }
  .jump-badge.show { opacity: 1; }

  .play-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 4; opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .play-icon svg { width: 60px; height: 60px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
  #viewer.paused .play-icon { opacity: 1; }

  .zoom-badge {
    position: absolute; top: 54px; right: 14px; z-index: 5;
    font-size: 12px; color: #fff; font-weight: 600;
    background: rgba(0,0,0,0.45); padding: 3px 9px; border-radius: 12px;
    opacity: 0; transition: opacity 0.2s;
  }
  .zoom-badge.show { opacity: 1; }

  .gyro-gate {
    position: absolute; inset: 0; z-index: 6;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6);
  }
  .gyro-gate.show { display: flex; }
  .gyro-gate-box { text-align: center; color: #fff; padding: 24px; }
  .gyro-gate-box p { font-size: 13px; color: rgba(255,255,255,0.7); margin: 10px 0 18px; max-width: 240px; }

  .bottom-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 10px 14px 16px; z-index: 5;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    transition: opacity 0.35s ease;
  }

  #viewer.controls-hidden .top-nav,
  #viewer.controls-hidden .bottom-controls,
  #viewer.controls-hidden .counter {
    opacity: 0; pointer-events: none;
  }
  .progress-bar {
    position: relative; height: 30px;
    display: flex; align-items: center;
    cursor: pointer; margin-bottom: 8px;
  }
  .progress-track {
    position: relative; width: 100%; height: 3px;
    background: rgba(255,255,255,0.25); border-radius: 2px;
    transition: height 0.15s;
  }
  .progress-bar.dragging .progress-track { height: 8px; }
  .progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; }
  .progress-thumb {
    position: absolute; top: 50%; left: 0%;
    width: 16px; height: 16px; background: #fff; border-radius: 50%;
    transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.2s;
  }
  .progress-bar.dragging .progress-thumb { opacity: 1; }
  .scrub-preview {
    position: absolute; bottom: 100%; margin-bottom: 10px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 6;
  }
  .scrub-preview.show { opacity: 1; }
  .scrub-thumb {
    width: 120px; height: 67px; border-radius: 8px; background: #111;
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    display: block;
  }
  .scrub-time {
    background: rgba(0,0,0,0.8); color: #fff;
    font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  }

  .control-row {
    display: flex; align-items: center; justify-content: center; gap: 22px;
  }
  .ctrl-btn {
    background: none; border: none; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.9;
  }
  .ctrl-btn:active { opacity: 0.5; }
  .ctrl-btn.play-pause {
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #833ab4, #fd1d1d);
  }
  .ctrl-btn svg { width: 22px; height: 22px; }
  .ctrl-btn.play-pause svg { width: 24px; height: 24px; }
  .ctrl-btn.skip svg { width: 24px; height: 24px; }
  .ctrl-btn.nav { opacity: 0.85; }
  .ctrl-btn[disabled] { opacity: 0.25; pointer-events: none; }

  :fullscreen { background: #000; }
</style>
</head>
<body>

<div id="picker-screen">
  <div id="picker-box">
    <div id="picker-icon">🥽</div>
    <div id="picker-title">VR Player</div>
    <div id="picker-sub">Load your 360&deg; / VR videos. Move your phone to look around.</div>
    <button class="picker-btn" id="folderBtn">
      Choose folder
      <input type="file" id="folderInput" webkitdirectory multiple accept="video/*" hidden>
    </button>
    <button class="picker-btn secondary" id="filesBtn">
      Choose files
      <input type="file" id="filesInput" multiple accept="video/*" hidden>
    </button>
  </div>
</div>

<div id="viewer">
  <canvas id="vr-canvas"></canvas>
  <div id="gesture-layer"></div>
  <div class="video-name-badge" id="videoNameBadge"></div>
  <div class="error-detail" id="errorDetail"></div>
  <div class="jump-badge" id="jumpBadge"></div>

  <div class="top-nav">
    <div class="nav-title" id="videoTitle">VR Player</div>
    <div class="nav-icons">
      <div class="nav-icon" id="zoomOutBtn" title="Zoom out">−</div>
      <div class="nav-icon" id="zoomInBtn" title="Zoom in">+</div>
      <div class="nav-icon" id="projToggle" title="Sphere / Flat">🌐</div>
      <div class="nav-icon" id="eyeToggle" title="Stereo eye (for SBS 3D video)">👁</div>
      <div class="nav-icon" id="modeToggle" title="Motion sensor on/off">🧭</div>
      <div class="nav-icon" id="touchToggle" title="Finger drag on/off">👆</div>
      <div class="nav-icon" id="fovToggle" title="180 / 360">360</div>
      <div class="nav-icon" id="fsToggle" title="Fullscreen">⛶</div>
      <div class="nav-icon" id="muteToggle" title="Mute">🔇</div>
    </div>
  </div>

  <div class="counter" id="counter"></div>
  <div class="zoom-badge" id="zoomBadge">100%</div>

  <div class="play-icon">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <div class="gyro-gate" id="gyroGate">
    <div class="gyro-gate-box">
      <div style="font-size:32px;margin-bottom:8px;">🧭</div>
      <p>Enable motion access so tilting your phone controls the view</p>
      <button class="picker-btn" id="gyroEnableBtn" style="width:220px;">Enable Motion Control</button>
    </div>
  </div>

  <div class="bottom-controls">
    <div class="progress-bar" id="progressBar">
      <div class="scrub-preview" id="scrubPreview">
        <canvas class="scrub-thumb" id="scrubThumb" width="160" height="90"></canvas>
        <div class="scrub-time" id="scrubTime">0:00</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
    </div>
    <div class="control-row">
      <button class="ctrl-btn nav" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn skip" id="backBtn" title="-10s">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button class="ctrl-btn play-pause" id="playPauseBtn" title="Play/Pause">
        <svg id="playIconBtn" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn skip" id="fwdBtn" title="+10s">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      </button>
      <button class="ctrl-btn nav" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const pickerScreen = document.getElementById('picker-screen');
const viewer = document.getElementById('viewer');
const canvas = document.getElementById('vr-canvas');
const gestureLayer = document.getElementById('gesture-layer');

document.getElementById('folderBtn').addEventListener('click', () => document.getElementById('folderInput').click());
document.getElementById('filesBtn').addEventListener('click', () => document.getElementById('filesInput').click());

let files = [];
let currentIndex = 0;
let isMuted = true;

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function loadVideos(fileList) {
  files = shuffleArray([...fileList].filter(f => f.type.startsWith('video/')));
  if (!files.length) { alert('No video files found.'); return; }
  pickerScreen.style.display = 'none';
  viewer.style.display = 'block';
  initViewer();
  loadIndex(0);
}

document.getElementById('folderInput').addEventListener('change', e => loadVideos(e.target.files));
document.getElementById('filesInput').addEventListener('change', e => loadVideos(e.target.files));

/* ===================== Raw WebGL VR viewer (no external library, fully offline) ===================== */

const DEG2RAD = Math.PI / 180;

let gl, program, posBuffer, uvBuffer, indexBuffer, indexCount, videoTex;
let aPositionLoc, aUVLoc, uViewProjLoc, uTexLoc, uUVScaleLoc, uUVOffsetLoc;
let video = document.createElement('video');
video.playsInline = true;
video.muted = true;
video.loop = true;

let lookMode = 'gyro';      // sensor state: 'gyro' = sensor ON, 'touch' = sensor OFF
let touchOn = true;         // finger drag ON/OFF (independent of the sensor)
function updateModeButtons() {
  const m = document.getElementById('modeToggle');
  const t = document.getElementById('touchToggle');
  m.textContent = '🧭'; t.textContent = '👆';
  m.classList.toggle('active', lookMode === 'gyro');
  m.classList.toggle('off', lookMode !== 'gyro');
  t.classList.toggle('active', touchOn);
  t.classList.toggle('off', !touchOn);
}
let is180 = false;
let lon = 0, lat = 0;
let baseFov = 90;
let fov = 90;
const MIN_FOV = 25, MAX_FOV = 130;

let projectionMode = 'sphere'; // 'sphere' (free-look) or 'flat' (locked forward view, dewarped)
let preFlatFov = 90;

let stereoMode = 'full'; // 'full' | 'left' | 'right' - for side-by-side stereo (SBS) VR footage
let uvScale = [1, 1], uvOffset = [0, 0];

let camQuat = { x: 0, y: 0, z: 0, w: 1 };
let gyroYaw = 0, gyroPitch = 0;   // finger-drag offset applied on top of the sensor
let startGyroYaw = 0, startGyroPitch = 0;
let deviceOrientationActive = false;
let screenOrientAngle = 0;

const VERTEX_SRC = `
  attribute vec3 aPosition;
  attribute vec2 aUV;
  uniform mat4 uViewProj;
  varying vec2 vUV;
  void main() {
    vUV = aUV;
    gl_Position = uViewProj * vec4(aPosition, 1.0);
  }
`;
const FRAGMENT_SRC = `
  precision mediump float;
  varying vec2 vUV;
  uniform sampler2D uTex;
  uniform vec2 uUVScale;
  uniform vec2 uUVOffset;
  void main() {
    gl_FragColor = texture2D(uTex, vUV * uUVScale + uUVOffset);
  }
`;

function compileShader(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function createProgram(gl, vsSrc, fsSrc) {
  const vs = compileShader(gl, gl.VERTEX_SHADER, vsSrc);
  const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSrc);
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

/* ---- minimal mat4 / quaternion math (column-major, WebGL convention) ---- */
function mat4Perspective(fovyRad, aspect, near, far) {
  const f = 1 / Math.tan(fovyRad / 2), nf = 1 / (near - far);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) * nf, -1,
    0, 0, 2 * far * near * nf, 0
  ]);
}
function mat4Multiply(a, b) {
  const out = new Float32Array(16);
  for (let col = 0; col < 4; col++)
    for (let row = 0; row < 4; row++) {
      let sum = 0;
      for (let k = 0; k < 4; k++) sum += a[k * 4 + row] * b[col * 4 + k];
      out[col * 4 + row] = sum;
    }
  return out;
}
function vsub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function vcross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function vdot(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function vnorm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }

function mat4LookAt(eye, center, up) {
  const zAxis = vnorm(vsub(eye, center));
  const xAxis = vnorm(vcross(up, zAxis));
  const yAxis = vcross(zAxis, xAxis);
  return new Float32Array([
    xAxis[0], yAxis[0], zAxis[0], 0,
    xAxis[1], yAxis[1], zAxis[1], 0,
    xAxis[2], yAxis[2], zAxis[2], 0,
    -vdot(xAxis, eye), -vdot(yAxis, eye), -vdot(zAxis, eye), 1
  ]);
}
function quatToMat4(q) {
  const { x, y, z, w } = q;
  const x2=x+x, y2=y+y, z2=z+z;
  const xx=x*x2, xy=x*y2, xz=x*z2, yy=y*y2, yz=y*z2, zz=z*z2, wx=w*x2, wy=w*y2, wz=w*z2;
  return new Float32Array([
    1-(yy+zz), xy+wz, xz-wy, 0,
    xy-wz, 1-(xx+zz), yz+wx, 0,
    xz+wy, yz-wx, 1-(xx+yy), 0,
    0, 0, 0, 1
  ]);
}
function mat4Transpose(m) {
  const out = new Float32Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) out[i*4+j] = m[j*4+i];
  return out;
}
function quatMultiply(a, b) {
  return {
    x: a.w*b.x + a.x*b.w + a.y*b.z - a.z*b.y,
    y: a.w*b.y - a.x*b.z + a.y*b.w + a.z*b.x,
    z: a.w*b.z + a.x*b.y - a.y*b.x + a.z*b.w,
    w: a.w*b.w - a.x*b.x - a.y*b.y - a.z*b.z
  };
}
function quatFromEulerYXZ(xRad, yRad, zRad) {
  const c1=Math.cos(xRad/2), s1=Math.sin(xRad/2);
  const c2=Math.cos(yRad/2), s2=Math.sin(yRad/2);
  const c3=Math.cos(zRad/2), s3=Math.sin(zRad/2);
  return {
    x: s1*c2*c3 + c1*s2*s3,
    y: c1*s2*c3 - s1*c2*s3,
    z: c1*c2*s3 - s1*s2*c3,
    w: c1*c2*c3 + s1*s2*s3
  };
}
function quatFromAxisAngle(axis, angle) {
  const half = angle / 2, s = Math.sin(half);
  return { x: axis[0]*s, y: axis[1]*s, z: axis[2]*s, w: Math.cos(half) };
}
const Q1_MINUS90_X = { x: -Math.SQRT1_2, y: 0, z: 0, w: Math.SQRT1_2 };

function initViewer() {
  gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) { alert('WebGL is not supported on this device/browser.'); return; }

  program = createProgram(gl, VERTEX_SRC, FRAGMENT_SRC);
  aPositionLoc = gl.getAttribLocation(program, 'aPosition');
  aUVLoc = gl.getAttribLocation(program, 'aUV');
  uViewProjLoc = gl.getUniformLocation(program, 'uViewProj');
  uTexLoc = gl.getUniformLocation(program, 'uTex');
  uUVScaleLoc = gl.getUniformLocation(program, 'uUVScale');
  uUVOffsetLoc = gl.getUniformLocation(program, 'uUVOffset');

  posBuffer = gl.createBuffer();
  uvBuffer = gl.createBuffer();
  indexBuffer = gl.createBuffer();

  videoTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, videoTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  gl.disable(gl.CULL_FACE);
  gl.disable(gl.DEPTH_TEST);

  buildSphere();
  applyStereoCrop();
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  animate();

  setupLookControls();
  setupZoomControls();
  setupPlaybackUI();
  setupTopNav();
  maybeShowGyroGate();
  setupAutoHideUI();
}

/* ---------- Auto-hide controls after inactivity, so it's just the video ---------- */
let uiHideTimer;
function showControls() {
  viewer.classList.remove('controls-hidden');
  clearTimeout(uiHideTimer);
  uiHideTimer = setTimeout(() => viewer.classList.add('controls-hidden'), 3000);
}
function toggleControls() {
  if (viewer.classList.contains('controls-hidden')) {
    showControls();
  } else {
    clearTimeout(uiHideTimer);
    viewer.classList.add('controls-hidden');
  }
}
function setupAutoHideUI() {
  // dragging/looking around no longer brings the UI back - only a center tap does
  showControls();
}

function buildSphere() {
  const widthSegments = 48, heightSegments = 32;
  const phiLength = is180 ? Math.PI : Math.PI * 2;
  const phiStart = is180 ? -Math.PI / 2 : 0; // centers a 180 video in front of the starting view
  const positions = [], uvs = [];
  for (let iy = 0; iy <= heightSegments; iy++) {
    const v = iy / heightSegments;
    const theta = v * Math.PI;
    for (let ix = 0; ix <= widthSegments; ix++) {
      const u = ix / widthSegments;
      const phi = phiStart + u * phiLength;
      positions.push(
        500 * Math.cos(phi) * Math.sin(theta),
        500 * Math.cos(theta),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      uvs.push(u, 1 - v);
    }
  }
  const indices = [];
  for (let iy = 0; iy < heightSegments; iy++) {
    for (let ix = 0; ix < widthSegments; ix++) {
      const a = iy * (widthSegments + 1) + ix;
      const b = a + widthSegments + 1;
      const c = a + 1;
      const d = b + 1;
      indices.push(a, b, c, b, d, c);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uvs), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);
  indexCount = indices.length;
}

function applyStereoCrop() {
  if (stereoMode === 'left') { uvScale = [0.5, 1]; uvOffset = [0, 0]; }
  else if (stereoMode === 'right') { uvScale = [0.5, 1]; uvOffset = [0.5, 0]; }
  else { uvScale = [1, 1]; uvOffset = [0, 0]; }
}

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
}

function animate() {
  requestAnimationFrame(animate);
  if (!gl) return;

  let view;
  if (projectionMode === 'flat') {
    // locked forward view - this is what actually removes the fisheye curve:
    // viewing a portion of the sphere through a normal perspective camera
    view = mat4LookAt([0, 0, 0], [500, 0, 0], [0, 1, 0]);
  } else if (lookMode === 'touch') {
    lat = Math.max(-85, Math.min(85, lat));
    const phi = (90 - lat) * DEG2RAD;
    const theta = lon * DEG2RAD;
    const target = [500*Math.sin(phi)*Math.cos(theta), 500*Math.cos(phi), 500*Math.sin(phi)*Math.sin(theta)];
    view = mat4LookAt([0, 0, 0], target, [0, 1, 0]);
  } else {
    // sphere+gyro mode: camQuat is set directly by the deviceorientation handler
    gyroPitch = Math.max(-85, Math.min(85, gyroPitch));
    const qYaw = quatFromAxisAngle([0, 1, 0], gyroYaw * DEG2RAD);
    const qPitch = quatFromAxisAngle([1, 0, 0], gyroPitch * DEG2RAD);
    const qFinal = quatMultiply(quatMultiply(qYaw, camQuat), qPitch);
    view = mat4Transpose(quatToMat4(qFinal));
  }

  const aspect = canvas.width / canvas.height;
  const proj = mat4Perspective(fov * DEG2RAD, aspect, 1, 1100);
  const viewProj = mat4Multiply(proj, view);

  if (video.readyState >= video.HAVE_CURRENT_DATA) {
    gl.bindTexture(gl.TEXTURE_2D, videoTex);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); } catch (e) {}
  }

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(program);
  gl.uniformMatrix4fv(uViewProjLoc, false, viewProj);
  gl.uniform2f(uUVScaleLoc, uvScale[0], uvScale[1]);
  gl.uniform2f(uUVOffsetLoc, uvOffset[0], uvOffset[1]);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, videoTex);
  gl.uniform1i(uTexLoc, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.enableVertexAttribArray(aPositionLoc);
  gl.vertexAttribPointer(aPositionLoc, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
  gl.enableVertexAttribArray(aUVLoc);
  gl.vertexAttribPointer(aUVLoc, 2, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_SHORT, 0);
}

/* ---------- Look controls: gyroscope ---------- */

function setCameraQuaternionFromDeviceOrientation(alpha, beta, gamma, orient) {
  let q = quatFromEulerYXZ(beta * DEG2RAD, alpha * DEG2RAD, -gamma * DEG2RAD);
  q = quatMultiply(q, Q1_MINUS90_X);
  q = quatMultiply(q, quatFromAxisAngle([0, 0, 1], -orient));
  camQuat = q;
}

function onDeviceOrientation(e) {
  if (e.alpha === null) return;
  if (projectionMode !== 'sphere') return;
  const orient = (screenOrientAngle || 0) * DEG2RAD;
  setCameraQuaternionFromDeviceOrientation(e.alpha, e.beta, e.gamma, orient);
}

function updateScreenOrientAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') {
    screenOrientAngle = screen.orientation.angle;
  } else {
    screenOrientAngle = window.orientation || 0;
  }
}
updateScreenOrientAngle();
window.addEventListener('orientationchange', updateScreenOrientAngle);

function enableGyro() {
  window.addEventListener('deviceorientation', onDeviceOrientation);
  deviceOrientationActive = true;
  lookMode = 'gyro';
  updateModeButtons();
}

function disableGyro() {
  window.removeEventListener('deviceorientation', onDeviceOrientation);
  deviceOrientationActive = false;
}

function maybeShowGyroGate() {
  const needsPermission = typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';

  if (needsPermission) {
    document.getElementById('gyroGate').classList.add('show');
    lookMode = 'touch';
    updateModeButtons();
  } else if (window.DeviceOrientationEvent) {
    enableGyro();
  } else {
    lookMode = 'touch';
    updateModeButtons();
    document.getElementById('modeToggle').style.display = 'none';
  }

  document.getElementById('gyroEnableBtn').addEventListener('click', async () => {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res === 'granted') {
        enableGyro();
      }
    } catch (err) { /* ignored */ }
    document.getElementById('gyroGate').classList.remove('show');
  });
}

/* ---------- Look controls: touch/mouse drag ---------- */

let dragging = false;
let dragStartX = 0, dragStartY = 0;
let startLon = 0, startLat = 0;
let pointerDownTime = 0;
let pointerMoved = false;
let pinching = false;
let pinchStartDist = 0;
let pinchStartFov = fov;

const SWIPE_DIST = 65;      // min vertical distance (px) to count as a reel-style swipe
const SWIPE_MAX_TIME = 550; // must happen within this many ms
const EDGE_ZONE = 0.16;     // swipe only registers if it starts within this fraction of screen width from an edge
const TAP_MAX_TIME = 300;
const TAP_MAX_MOVE = 8;
const DOUBLE_TAP_WINDOW = 300;
const LONG_PRESS_TIME = 380; // ms held still in the center zone before it becomes a hidden scrub

let lastTapZone = null;
let lastTapTime = 0;
let centerTapTimer = null;

let curClientX = 0, curClientY = 0;
let longPressTimer = null;
let hiddenScrubActive = false;
let scrubStartTime = 0;

function scrubToClientX(clientX) {
  if (!video.duration) return;
  const pct = Math.max(0, Math.min(1, clientX / window.innerWidth));
  const newTime = pct * video.duration;
  video.currentTime = newTime;
  showJumpBadge(newTime - scrubStartTime);
}

let jumpBadgeEl = null;
function showJumpBadge(deltaSeconds) {
  if (!jumpBadgeEl) jumpBadgeEl = document.getElementById('jumpBadge');
  const s = Math.round(deltaSeconds);
  jumpBadgeEl.textContent = (s >= 0 ? '+' : '') + s + 's';
  jumpBadgeEl.classList.add('show');
}
function hideJumpBadge() {
  if (!jumpBadgeEl) jumpBadgeEl = document.getElementById('jumpBadge');
  jumpBadgeEl.classList.remove('show');
}

function setupLookControls() {
  gestureLayer.addEventListener('pointerdown', onPointerDown);
  gestureLayer.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  gestureLayer.addEventListener('touchstart', onTouchStart, { passive: false });
  gestureLayer.addEventListener('touchmove', onTouchMove, { passive: false });
  gestureLayer.addEventListener('touchend', onTouchEnd);
}

function onPointerDown(e) {
  dragging = true;
  pointerMoved = false;
  pointerDownTime = Date.now();
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  curClientX = e.clientX;
  curClientY = e.clientY;
  startLon = lon;
  startLat = lat;
  startGyroYaw = gyroYaw;
  startGyroPitch = gyroPitch;

  hiddenScrubActive = false;
  clearTimeout(longPressTimer);
  if (zoneForX(e.clientX) === 'center') {
    longPressTimer = setTimeout(() => {
      if (dragging && !pointerMoved && !pinching) {
        hiddenScrubActive = true;
        scrubStartTime = video.currentTime;
        if (navigator.vibrate) navigator.vibrate(15);
        scrubToClientX(curClientX);
      }
    }, LONG_PRESS_TIME);
  }
}

function onPointerMove(e) {
  curClientX = e.clientX;
  curClientY = e.clientY;
  if (!dragging || pinching) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) pointerMoved = true;

  if (hiddenScrubActive) {
    scrubToClientX(e.clientX);
    return;
  }
  if (touchOn && projectionMode === 'sphere' && lookMode === 'touch') {
    lon = startLon - dx * 0.18;
    lat = startLat + dy * 0.18;
  } else if (touchOn && projectionMode === 'sphere' && lookMode === 'gyro') {
    // sensor + finger drag together
    gyroYaw = startGyroYaw + dx * 0.18;
    gyroPitch = startGyroPitch + dy * 0.18;
  }
}

function zoneForX(clientX) {
  const w = window.innerWidth;
  if (clientX < w * 0.25) return 'left';
  if (clientX > w * 0.75) return 'right';
  return 'center';
}

function onPointerUp(e) {
  clearTimeout(longPressTimer);
  dragging = false;
  if (pinching) return;

  // A hidden long-press scrub just ended - don't let its release register as a tap.
  if (hiddenScrubActive) {
    hiddenScrubActive = false;
    hideJumpBadge();
    return;
  }

  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  const elapsed = Date.now() - pointerDownTime;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  // Reel-style swipe: vertical flick from the extreme edges switches videos
  const w = window.innerWidth;
  const startedInEdgeZone = dragStartX < w * EDGE_ZONE || dragStartX > w * (1 - EDGE_ZONE);

  if (startedInEdgeZone && absDy > SWIPE_DIST && absDy > absDx * 1.4 && elapsed < SWIPE_MAX_TIME) {
    if (dy < 0) loadIndex(currentIndex + 1); // swipe up -> next video
    else loadIndex(currentIndex - 1);        // swipe down -> previous video
    return;
  }

  // Tap handling
  if (!pointerMoved && elapsed < TAP_MAX_TIME) {
    const zone = zoneForX(e.clientX);
    const now = Date.now();
    const isDoubleTap = zone === lastTapZone && (now - lastTapTime) < DOUBLE_TAP_WINDOW;

    if (zone === 'center') {
      if (isDoubleTap) {
        // Double tap center: toggle pause/resume
        clearTimeout(centerTapTimer);
        togglePlay();
        lastTapZone = null;
        lastTapTime = 0;
        return;
      } else {
        // Wait to see if a second tap follows; if not, single tap shows/hides the controls
        clearTimeout(centerTapTimer);
        centerTapTimer = setTimeout(() => { toggleControls(); }, DOUBLE_TAP_WINDOW);
      }
    } else if (isDoubleTap) {
      if (zone === 'left') video.currentTime = Math.max(0, video.currentTime - 10);
      else video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 10);
      showSeekBadge(zone);
    }

    lastTapZone = zone;
    lastTapTime = isDoubleTap ? 0 : now; // reset so a triple-tap doesn't re-trigger
  }
}

let seekBadgeTimer;
function showSeekBadge(zone) {
  const badge = document.getElementById('zoomBadge');
  badge.textContent = zone === 'left' ? '« 10s' : '10s »';
  badge.classList.add('show');
  clearTimeout(seekBadgeTimer);
  clearTimeout(zoomBadgeTimer);
  seekBadgeTimer = setTimeout(() => badge.classList.remove('show'), 700);
}

/* pinch-to-zoom (touch) */
function dist(t0, t1) {
  const dx = t0.clientX - t1.clientX;
  const dy = t0.clientY - t1.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function onTouchStart(e) {
  if (e.touches.length === 2) {
    pinching = true;
    dragging = false;
    pinchStartDist = dist(e.touches[0], e.touches[1]);
    pinchStartFov = fov;
    e.preventDefault();
  }
}

function onTouchMove(e) {
  if (pinching && e.touches.length === 2) {
    const d = dist(e.touches[0], e.touches[1]);
    const scale = pinchStartDist / d; // pinch out (d grows) -> zoom in -> lower fov
    let newFov = pinchStartFov * scale;
    fov = Math.max(MIN_FOV, Math.min(MAX_FOV, newFov));
    showZoomBadge();
    e.preventDefault();
  }
}

function onTouchEnd(e) {
  if (e.touches.length < 2) pinching = false;
}

/* mouse wheel zoom (desktop testing) */
function setupZoomControls() {
  gestureLayer.addEventListener('wheel', (e) => {
    e.preventDefault();
    fov = Math.max(MIN_FOV, Math.min(MAX_FOV, fov + e.deltaY * 0.05));
    showZoomBadge();
  }, { passive: false });
}

let zoomBadgeTimer;
function showZoomBadge() {
  const badge = document.getElementById('zoomBadge');
  const pct = Math.round((baseFov / fov) * 100);
  badge.textContent = pct + '%';
  badge.classList.add('show');
  clearTimeout(zoomBadgeTimer);
  zoomBadgeTimer = setTimeout(() => badge.classList.remove('show'), 900);
}

/* ---------- Playback / progress bar / skip ---------- */

function togglePlay() {
  if (video.paused) {
    video.play();
    viewer.classList.remove('paused');
    document.getElementById('playIconBtn').innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  } else {
    video.pause();
    viewer.classList.add('paused');
    document.getElementById('playIconBtn').innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function setupPlaybackUI() {
  document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
  document.getElementById('backBtn').addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
  document.getElementById('fwdBtn').addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });
  document.getElementById('prevBtn').addEventListener('click', () => loadIndex(currentIndex - 1));
  document.getElementById('nextBtn').addEventListener('click', () => loadIndex(currentIndex + 1));

  video.addEventListener('play', () => {
    viewer.classList.remove('paused');
    document.getElementById('playIconBtn').innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  });
  video.addEventListener('pause', () => {
    viewer.classList.add('paused');
    document.getElementById('playIconBtn').innerHTML = '<path d="M8 5v14l11-7z"/>';
  });
  video.addEventListener('error', () => {
    const badge = document.getElementById('videoNameBadge');
    const detail = document.getElementById('errorDetail');
    badge.classList.add('error');
    const codeMsg = {
      1: 'Loading aborted',
      2: 'Network error while loading',
      3: 'Decode error - codec inside this file isn\u2019t supported by this browser',
      4: 'Format/codec not supported by this browser'
    };
    const code = video.error ? video.error.code : 0;
    detail.textContent = '\u26a0 ' + (codeMsg[code] || 'Unknown playback error') + ' (code ' + code + ')';
    detail.classList.add('show');
  });

  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressThumb = document.getElementById('progressThumb');
  const scrubPreview = document.getElementById('scrubPreview');
  const scrubTime = document.getElementById('scrubTime');
  const scrubThumb = document.getElementById('scrubThumb');
  const scrubCtx = scrubThumb.getContext('2d');
  let scrubbing = false;

  // hidden video used purely to grab preview frames without disturbing playback
  const previewVideo = document.createElement('video');
  previewVideo.muted = true;
  previewVideo.playsInline = true;
  previewVideo.preload = 'auto';
  let previewSeeking = false;
  let pendingPreviewTime = null;
  let previewTimeoutId = null;

  function drawPreviewFrame() {
    try { scrubCtx.drawImage(previewVideo, 0, 0, scrubThumb.width, scrubThumb.height); } catch (e) {}
  }

  function resolvePreviewSeek() {
    clearTimeout(previewTimeoutId);
    previewSeeking = false;
    drawPreviewFrame();
    if (pendingPreviewTime !== null) {
      const t = pendingPreviewTime;
      pendingPreviewTime = null;
      requestPreviewFrame(t);
    }
  }

  function requestPreviewFrame(time) {
    if (!previewVideo.src || !isFinite(previewVideo.duration)) { pendingPreviewTime = time; return; }
    time = Math.max(0, Math.min(previewVideo.duration, time));
    if (previewSeeking) { pendingPreviewTime = time; return; }
    // already close enough - just redraw the current frame, no need to seek
    if (Math.abs(previewVideo.currentTime - time) < 0.1) { drawPreviewFrame(); return; }
    previewSeeking = true;
    previewVideo.currentTime = time;
    // safety net: some browsers/files never fire 'seeked' for edge cases - don't stay stuck
    clearTimeout(previewTimeoutId);
    previewTimeoutId = setTimeout(resolvePreviewSeek, 400);
  }

  previewVideo.addEventListener('seeked', resolvePreviewSeek);
  previewVideo.addEventListener('loadedmetadata', () => {
    if (pendingPreviewTime !== null) {
      const t = pendingPreviewTime;
      pendingPreviewTime = null;
      requestPreviewFrame(t);
    }
  });

  function formatTime(t) {
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  video.addEventListener('timeupdate', () => {
    if (video.duration && !scrubbing) {
      const pct = (video.currentTime / video.duration) * 100;
      progressFill.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
    }
  });

  function updateFromEvent(e) {
    const rect = progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
    const targetTime = pct * (video.duration || 0);
    if (video.duration) video.currentTime = targetTime;

    scrubPreview.style.left = (pct * 100) + '%';
    scrubTime.textContent = formatTime(targetTime);
    requestPreviewFrame(targetTime);
  }

  progressBar.addEventListener('pointerdown', (e) => {
    scrubbing = true;
    progressBar.classList.add('dragging');
    scrubPreview.classList.add('show');
    if (previewVideo.src !== video.src) {
      clearTimeout(previewTimeoutId);
      previewSeeking = false;
      pendingPreviewTime = null;
      previewVideo.src = video.src;
    }
    updateFromEvent(e);
  });
  window.addEventListener('pointermove', (e) => { if (scrubbing) updateFromEvent(e); });
  window.addEventListener('pointerup', () => {
    if (scrubbing) {
      scrubbing = false;
      progressBar.classList.remove('dragging');
      scrubPreview.classList.remove('show');
    }
  });
}

/* ---------- Top nav: mode / 180-360 / fullscreen / mute ---------- */

function setupTopNav() {
  const ZOOM_STEP = 8;
  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    fov = Math.min(MAX_FOV, fov + ZOOM_STEP);
    showZoomBadge();
  });
  document.getElementById('zoomInBtn').addEventListener('click', () => {
    fov = Math.max(MIN_FOV, fov - ZOOM_STEP);
    showZoomBadge();
  });

  document.getElementById('projToggle').addEventListener('click', () => {
    setProjectionMode(projectionMode === 'sphere' ? 'flat' : 'sphere');
  });

  document.getElementById('eyeToggle').addEventListener('click', () => {
    stereoMode = stereoMode === 'full' ? 'left' : (stereoMode === 'left' ? 'right' : 'full');
    applyStereoCrop();
    const btn = document.getElementById('eyeToggle');
    btn.textContent = stereoMode === 'full' ? '👁' : (stereoMode === 'left' ? 'L' : 'R');
    btn.classList.toggle('active', stereoMode !== 'full');
  });

  // Sensor ON/OFF
  document.getElementById('modeToggle').addEventListener('click', () => {
    if (lookMode === 'gyro') {
      lookMode = 'touch';          // sensor OFF
      lon = 0; lat = 0;
    } else if (deviceOrientationActive) {
      lookMode = 'gyro';           // sensor ON
      gyroYaw = 0; gyroPitch = 0;
    } else {
      document.getElementById('gyroGate').classList.add('show');
    }
    updateModeButtons();
  });

  // Finger drag ON/OFF
  document.getElementById('touchToggle').addEventListener('click', () => {
    touchOn = !touchOn;
    updateModeButtons();
  });

  document.getElementById('fovToggle').addEventListener('click', () => {
    is180 = !is180;
    document.getElementById('fovToggle').textContent = is180 ? '180' : '360';
    buildSphere();
  });

  document.getElementById('fsToggle').addEventListener('click', async () => {
    if (!document.fullscreenElement) {
      try { await viewer.requestFullscreen(); } catch (err) {}
    } else {
      document.exitFullscreen();
    }
  });

  document.getElementById('muteToggle').addEventListener('click', () => {
    isMuted = !isMuted;
    video.muted = isMuted;
    document.getElementById('muteToggle').textContent = isMuted ? '🔇' : '🔊';
  });
}

function setProjectionMode(mode) {
  const flat = mode === 'flat';

  if (flat && projectionMode !== 'flat') {
    preFlatFov = fov;
    fov = 70; // a moderate FOV reads as "normal" video instead of fisheye-wide
    lon = 0; lat = 0;
  } else if (!flat && projectionMode === 'flat') {
    fov = preFlatFov;
  }
  projectionMode = mode;

  const projBtn = document.getElementById('projToggle');
  projBtn.textContent = flat ? '▭' : '🌐';
  projBtn.classList.toggle('active', flat);

  // gyro/touch look mode only makes sense in free-look sphere mode
  document.getElementById('modeToggle').style.display = flat ? 'none' : 'flex';
  document.getElementById('touchToggle').style.display = flat ? 'none' : 'flex';
}

/* ---------- Playlist ---------- */

function guessMimeType(name, fallback) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const map = {
    mp4: 'video/mp4', m4v: 'video/mp4',
    mov: 'video/quicktime',
    webm: 'video/webm',
    mkv: 'video/x-matroska',
    avi: 'video/x-msvideo',
    '3gp': 'video/3gpp', '3g2': 'video/3gpp2',
    ogv: 'video/ogg'
  };
  return map[ext] || fallback || 'video/mp4';
}

function loadIndex(idx) {
  if (idx < 0 || idx >= files.length) return;
  currentIndex = idx;
  let file = files[idx];
  // Some pickers/OSes hand back an empty or wrong file.type (especially for .mov/.mkv),
  // which makes the browser refuse to even attempt playback. Re-tag it from the extension
  // so it gets a fair shot - this does NOT add codec support, it just fixes misdetection.
  const mime = guessMimeType(file.name, file.type);
  if (file.type !== mime) {
    file = new File([file], file.name, { type: mime, lastModified: file.lastModified });
    files[idx] = file;
  }
  const url = URL.createObjectURL(file);
  video.src = url;
  video.muted = isMuted;
  video.play().catch(() => {});
  document.getElementById('videoTitle').textContent = file.name.replace(/\.[^/.]+$/, '');
  document.getElementById('counter').textContent = (idx + 1) + ' / ' + files.length;
  const nameBadge = document.getElementById('videoNameBadge');
  nameBadge.textContent = file.name.replace(/\.[^/.]+$/, '');
  nameBadge.classList.remove('error');
  nameBadge.title = '';
  const detailEl = document.getElementById('errorDetail');
  detailEl.classList.remove('show');
  detailEl.textContent = '';
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === files.length - 1;
  // reset view/zoom for the new video
  lon = 0; lat = 0; gyroYaw = 0; gyroPitch = 0; fov = baseFov;
  if (typeof showControls === 'function') showControls();
}

/* ---------- PWA plumbing ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); });
</script>
